<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111418" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Qashqai Log</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    /* ─── TOKENS ─── */
    :root {
      --bg:        #111418;
      --surface:   #1a1f26;
      --surface2:  #222831;
      --border:    #2c333d;
      --accent:    #e8a020;
      --accent-dim:#3d2c08;
      --green:     #3ecf8e;
      --green-dim: #0d2d1f;
      --red:       #e85d5d;
      --red-dim:   #2d1010;
      --text:      #eaf0f8;
      --muted:     #6b7888;
      --label:     #9aa5b4;
      --radius:    10px;
      --radius-sm: 6px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      padding-bottom: 80px;
    }

    /* ─── HEADER ─── */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 14px 16px 12px;
    }
    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .car-name {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--accent);
    }
    .car-sub {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      margin-top: 1px;
    }
    .mileage-pill {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 5px 12px;
      font-size: 13px;
      font-weight: 600;
      color: var(--label);
      cursor: pointer;
      transition: border-color .15s;
    }
    .mileage-pill span { color: var(--text); }
    .mileage-pill:hover { border-color: var(--accent); }

    /* ─── TABS ─── */
    nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 100;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
    }
    nav button {
      flex: 1;
      background: none;
      border: none;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .04em;
      text-transform: uppercase;
      padding: 10px 0 calc(10px + env(safe-area-inset-bottom));
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: color .15s;
    }
    nav button.active { color: var(--accent); }
    nav button svg { width: 20px; height: 20px; }

    /* ─── VIEWS ─── */
    .view { display: none; padding: 16px; }
    .view.active { display: block; }

    /* ─── SUMMARY CARDS ─── */
    .summary-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 18px;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
    }
    .stat-card.wide { grid-column: 1 / -1; }
    .stat-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .stat-value {
      font-size: 26px;
      font-weight: 800;
      color: var(--text);
      line-height: 1;
    }
    .stat-value.accent { color: var(--accent); }
    .stat-value.green  { color: var(--green); }
    .stat-unit {
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      margin-left: 3px;
    }
    .stat-sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
    }

    /* ─── SECTION HEADER ─── */
    .section-hdr {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 18px 0 10px;
    }
    .section-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--label);
    }
    .btn-add {
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: var(--radius-sm);
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity .15s;
    }
    .btn-add:hover { opacity: .85; }

    /* ─── LOG LIST ─── */
    .log-list { display: flex; flex-direction: column; gap: 8px; }
    .log-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .log-item:active { opacity: .75; }
    .log-left { display: flex; align-items: center; gap: 10px; }
    .log-icon {
      width: 36px; height: 36px;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      font-size: 16px;
    }
    .log-icon.fuel  { background: var(--accent-dim); }
    .log-icon.maint { background: var(--green-dim); }
    .log-title { font-size: 14px; font-weight: 600; color: var(--text); }
    .log-meta  { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .log-right { text-align: right; flex-shrink: 0; }
    .log-cost  { font-size: 15px; font-weight: 700; color: var(--text); }
    .log-mpg   { font-size: 12px; color: var(--green); margin-top: 2px; }
    .log-del   {
      background: none; border: none; color: var(--muted);
      cursor: pointer; padding: 4px; border-radius: 4px;
      font-size: 14px; line-height: 1;
    }
    .log-del:hover { color: var(--red); }

    .empty-msg {
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      padding: 32px 0;
    }

    /* ─── MODAL ─── */
    .modal-backdrop {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,.7);
      z-index: 200;
      align-items: flex-end;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: var(--surface);
      border-top: 1px solid var(--border);
      border-radius: 16px 16px 0 0;
      padding: 20px 16px calc(20px + env(safe-area-inset-bottom));
      width: 100%;
      max-height: 92dvh;
      overflow-y: auto;
    }
    .modal-title {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 18px;
    }
    .field { margin-bottom: 14px; }
    .field label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .field input, .field select, .field textarea {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      font-size: 15px;
      color: var(--text);
      font-family: inherit;
      outline: none;
      transition: border-color .15s;
      -webkit-appearance: none;
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      border-color: var(--accent);
    }
    .field textarea { resize: vertical; min-height: 70px; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .modal-actions { display: flex; gap: 10px; margin-top: 6px; }
    .btn-primary {
      flex: 1;
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: var(--radius-sm);
      padding: 13px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-cancel {
      background: var(--surface2);
      color: var(--label);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 13px 18px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    /* ─── MONTH TABS ─── */
    .period-toggle {
      display: flex;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 3px;
      gap: 3px;
      margin-bottom: 14px;
    }
    .period-btn {
      flex: 1;
      background: none;
      border: none;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      padding: 8px 4px;
      border-radius: 7px;
      cursor: pointer;
      transition: all .15s;
    }
    .period-btn.active {
      background: var(--accent-dim);
      color: var(--accent);
    }

    /* ─── COST BREAKDOWN ─── */
    .breakdown {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 10px;
    }
    .breakdown-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 11px 14px;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
    }
    .breakdown-row:last-child { border-bottom: none; }
    .breakdown-row .lbl { color: var(--label); }
    .breakdown-row .val { font-weight: 700; }
    .breakdown-row.total .lbl { color: var(--text); font-weight: 700; }
    .breakdown-row.total .val { color: var(--accent); font-size: 16px; }

    /* ─── MPG CHART (simple bars) ─── */
    .mpg-chart { margin-top: 4px; }
    .mpg-bar-row {
      display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
    }
    .mpg-bar-label { font-size: 11px; color: var(--muted); width: 60px; flex-shrink: 0; }
    .mpg-bar-track {
      flex: 1; height: 8px;
      background: var(--surface2);
      border-radius: 4px;
      overflow: hidden;
    }
    .mpg-bar-fill {
      height: 100%;
      border-radius: 4px;
      background: var(--green);
      transition: width .4s;
    }
    .mpg-bar-val { font-size: 12px; font-weight: 700; color: var(--green); width: 44px; text-align: right; }
  </style>
</head>
<body>

<header>
  <div class="header-top">
    <div>
      <div class="car-name">Qashqai Log</div>
      <div class="car-sub">2009 Nissan Qashqai 1.6</div>
    </div>
    <button class="mileage-pill" id="mileagePill" onclick="openMileageModal()">
      <span id="currentMileage">0</span> mi
    </button>
  </div>
</header>

<!-- ─── VIEWS ─── -->
<main>

  <!-- FUEL VIEW -->
  <section class="view active" id="view-fuel">
    <div class="section-hdr" style="margin-top:6px">
      <span class="section-title">Fuel Log</span>
      <button class="btn-add" onclick="openFuelModal()">+ Add Fill-up</button>
    </div>
    <div class="log-list" id="fuelList"></div>
  </section>

  <!-- MAINTENANCE VIEW -->
  <section class="view" id="view-maint">
    <div class="section-hdr" style="margin-top:6px">
      <span class="section-title">Maintenance</span>
      <button class="btn-add" onclick="openMaintModal()">+ Add Record</button>
    </div>
    <div class="log-list" id="maintList"></div>
  </section>

  <!-- SUMMARY VIEW -->
  <section class="view" id="view-summary">
    <div style="margin-top:6px"></div>
    <div class="period-toggle">
      <button class="period-btn active" id="pBtn-month" onclick="setPeriod('month')">This Month</button>
      <button class="period-btn" id="pBtn-year"  onclick="setPeriod('year')">This Year</button>
      <button class="period-btn" id="pBtn-all"   onclick="setPeriod('all')">All Time</button>
    </div>
    <div class="summary-grid" id="summaryGrid"></div>
    <div class="section-title" style="margin-bottom:10px">Cost Breakdown</div>
    <div class="breakdown" id="breakdownTable"></div>
    <div class="section-title" style="margin: 16px 0 10px">MPG per Fill-up</div>
    <div class="mpg-chart" id="mpgChart"></div>
  </section>

</main>

<!-- ─── NAV ─── -->
<nav>
  <button class="active" id="tab-fuel" onclick="switchTab('fuel')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 22V10l7-7 7 7v12H3z"/><path d="M10 22v-6h4v6"/><path d="M20 10h1a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-1"/>
    </svg>
    Fuel
  </button>
  <button id="tab-maint" onclick="switchTab('maint')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/>
    </svg>
    Service
  </button>
  <button id="tab-summary" onclick="switchTab('summary')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/>
    </svg>
    Summary
  </button>
</nav>

<!-- ─── FUEL MODAL ─── -->
<div class="modal-backdrop" id="fuelModal">
  <div class="modal">
    <div class="modal-title">Add Fill-up</div>
    <div class="field-row">
      <div class="field">
        <label>Date</label>
        <input type="date" id="f-date" />
      </div>
      <div class="field">
        <label>Mileage (mi)</label>
        <input type="number" id="f-mileage" placeholder="e.g. 87500" />
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label>Litres</label>
        <input type="number" id="f-litres" step="0.01" placeholder="e.g. 45.2" oninput="calcFuelPreview()" />
      </div>
      <div class="field">
        <label>Total Cost (£)</label>
        <input type="number" id="f-cost" step="0.01" placeholder="e.g. 68.50" oninput="calcFuelPreview()" />
      </div>
    </div>
    <div class="field">
      <label>Previous Mileage (mi) — for MPG</label>
      <input type="number" id="f-prev-mileage" placeholder="leave blank to skip MPG calc" oninput="calcFuelPreview()" />
    </div>
    <div id="fuelPreview" style="font-size:13px;color:var(--green);min-height:18px;margin-bottom:10px;"></div>
    <div class="field">
      <label>Notes</label>
      <input type="text" id="f-notes" placeholder="e.g. Shell Tesco, full tank" />
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModals()">Cancel</button>
      <button class="btn-primary" onclick="saveFuel()">Save</button>
    </div>
  </div>
</div>

<!-- ─── MAINT MODAL ─── -->
<div class="modal-backdrop" id="maintModal">
  <div class="modal">
    <div class="modal-title">Add Service Record</div>
    <div class="field-row">
      <div class="field">
        <label>Date</label>
        <input type="date" id="m-date" />
      </div>
      <div class="field">
        <label>Mileage (mi)</label>
        <input type="number" id="m-mileage" placeholder="e.g. 87500" />
      </div>
    </div>
    <div class="field">
      <label>Service Type</label>
      <select id="m-type">
        <option value="Oil Change">Oil Change</option>
        <option value="Tyre Rotation">Tyre Rotation</option>
        <option value="Tyre Replacement">Tyre Replacement</option>
        <option value="Brake Service">Brake Service</option>
        <option value="Air Filter">Air Filter</option>
        <option value="Spark Plugs">Spark Plugs</option>
        <option value="Battery">Battery</option>
        <option value="MOT">MOT</option>
        <option value="Service (Full)">Service (Full)</option>
        <option value="Service (Interim)">Service (Interim)</option>
        <option value="Other">Other</option>
      </select>
    </div>
    <div class="field">
      <label>Cost (£)</label>
      <input type="number" id="m-cost" step="0.01" placeholder="e.g. 35.00" />
    </div>
    <div class="field">
      <label>Notes</label>
      <textarea id="m-notes" placeholder="e.g. Used Castrol Edge 5W-30 A3/B4, 4.2L"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModals()">Cancel</button>
      <button class="btn-primary" onclick="saveMaint()">Save</button>
    </div>
  </div>
</div>

<!-- ─── MILEAGE MODAL ─── -->
<div class="modal-backdrop" id="mileageModal">
  <div class="modal">
    <div class="modal-title">Update Mileage</div>
    <div class="field">
      <label>Current Mileage (mi)</label>
      <input type="number" id="mm-val" placeholder="e.g. 88000" />
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModals()">Cancel</button>
      <button class="btn-primary" onclick="saveMileage()">Save</button>
    </div>
  </div>
</div>

<script>
// ─── STATE ───────────────────────────────────────────────────
let state = {
  mileage: 0,
  fuel: [],    // { id, date, mileage, litres, cost, prevMileage, mpg, notes }
  maint: []    // { id, date, mileage, type, cost, notes }
};

function load() {
  const raw = localStorage.getItem('qashqai-log');
  if (raw) state = JSON.parse(raw);
}

function save() {
  localStorage.setItem('qashqai-log', JSON.stringify(state));
}

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }

// ─── TABS ────────────────────────────────────────────────────
let currentTab = 'fuel';

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.getElementById('view-' + tab).classList.add('active');
  document.getElementById('tab-' + tab).classList.add('active');
  if (tab === 'summary') renderSummary();
}

// ─── MILEAGE ─────────────────────────────────────────────────
function openMileageModal() {
  document.getElementById('mm-val').value = state.mileage || '';
  document.getElementById('mileageModal').classList.add('open');
  setTimeout(() => document.getElementById('mm-val').focus(), 80);
}

function saveMileage() {
  const v = parseInt(document.getElementById('mm-val').value);
  if (!v || v < 0) return;
  state.mileage = v;
  save();
  renderMileagePill();
  closeModals();
}

function renderMileagePill() {
  document.getElementById('currentMileage').textContent =
    state.mileage ? state.mileage.toLocaleString() : '—';
}

// ─── FUEL ────────────────────────────────────────────────────
function openFuelModal() {
  document.getElementById('f-date').value = today();
  document.getElementById('f-mileage').value = state.mileage || '';
  document.getElementById('f-litres').value = '';
  document.getElementById('f-cost').value = '';
  document.getElementById('f-prev-mileage').value = lastFuelMileage();
  document.getElementById('f-notes').value = '';
  document.getElementById('fuelPreview').textContent = '';
  document.getElementById('fuelModal').classList.add('open');
}

function lastFuelMileage() {
  if (!state.fuel.length) return '';
  return state.fuel.slice().sort((a,b) => new Date(b.date)-new Date(a.date))[0].mileage || '';
}

function calcFuelPreview() {
  const litres = parseFloat(document.getElementById('f-litres').value);
  const cost   = parseFloat(document.getElementById('f-cost').value);
  const cur    = parseFloat(document.getElementById('f-mileage').value);
  const prev   = parseFloat(document.getElementById('f-prev-mileage').value);
  const parts  = [];
  if (litres && cost) {
    parts.push('£' + (cost / litres).toFixed(3) + '/L');
  }
  if (litres && cur && prev && cur > prev) {
    const miles = cur - prev;
    const mpg   = (miles / litres) * 4.54609;
    parts.push(mpg.toFixed(1) + ' MPG');
  }
  document.getElementById('fuelPreview').textContent = parts.join('  ·  ');
}

function saveFuel() {
  const date  = document.getElementById('f-date').value;
  const mi    = parseFloat(document.getElementById('f-mileage').value);
  const lit   = parseFloat(document.getElementById('f-litres').value);
  const cost  = parseFloat(document.getElementById('f-cost').value);
  const prev  = parseFloat(document.getElementById('f-prev-mileage').value);
  const notes = document.getElementById('f-notes').value.trim();
  if (!date || !lit || !cost) { alert('Date, litres and cost are required.'); return; }
  let mpg = null;
  if (prev && mi && mi > prev) {
    mpg = ((mi - prev) / lit) * 4.54609;
  }
  state.fuel.push({ id: uid(), date, mileage: mi || null, litres: lit, cost, prevMileage: prev || null, mpg, notes });
  if (mi && mi > (state.mileage || 0)) { state.mileage = mi; }
  save();
  renderMileagePill();
  renderFuelList();
  closeModals();
}

function deleteFuel(id) {
  if (!confirm('Delete this fill-up?')) return;
  state.fuel = state.fuel.filter(f => f.id !== id);
  save();
  renderFuelList();
}

function renderFuelList() {
  const el = document.getElementById('fuelList');
  const sorted = state.fuel.slice().sort((a,b) => new Date(b.date)-new Date(a.date));
  if (!sorted.length) {
    el.innerHTML = '<div class="empty-msg">No fill-ups yet. Add your first one.</div>';
    return;
  }
  el.innerHTML = sorted.map(f => `
    <div class="log-item">
      <div class="log-left">
        <div class="log-icon fuel">⛽</div>
        <div>
          <div class="log-title">${fmtDate(f.date)}</div>
          <div class="log-meta">${f.litres}L${f.mileage ? ' · ' + f.mileage.toLocaleString() + ' mi' : ''}${f.notes ? ' · ' + f.notes : ''}</div>
        </div>
      </div>
      <div class="log-right">
        <div class="log-cost">£${f.cost.toFixed(2)}</div>
        ${f.mpg ? `<div class="log-mpg">${f.mpg.toFixed(1)} MPG</div>` : ''}
      </div>
      <button class="log-del" onclick="deleteFuel('${f.id}')" title="Delete">✕</button>
    </div>
  `).join('');
}

// ─── MAINTENANCE ─────────────────────────────────────────────
function openMaintModal() {
  document.getElementById('m-date').value = today();
  document.getElementById('m-mileage').value = state.mileage || '';
  document.getElementById('m-type').value = 'Oil Change';
  document.getElementById('m-cost').value = '';
  document.getElementById('m-notes').value = '';
  document.getElementById('maintModal').classList.add('open');
}

function saveMaint() {
  const date  = document.getElementById('m-date').value;
  const mi    = parseFloat(document.getElementById('m-mileage').value);
  const type  = document.getElementById('m-type').value;
  const cost  = parseFloat(document.getElementById('m-cost').value);
  const notes = document.getElementById('m-notes').value.trim();
  if (!date || !type) { alert('Date and type are required.'); return; }
  state.maint.push({ id: uid(), date, mileage: mi || null, type, cost: cost || 0, notes });
  if (mi && mi > (state.mileage || 0)) { state.mileage = mi; }
  save();
  renderMileagePill();
  renderMaintList();
  closeModals();
}

function deleteMaint(id) {
  if (!confirm('Delete this record?')) return;
  state.maint = state.maint.filter(m => m.id !== id);
  save();
  renderMaintList();
}

function renderMaintList() {
  const el = document.getElementById('maintList');
  const sorted = state.maint.slice().sort((a,b) => new Date(b.date)-new Date(a.date));
  if (!sorted.length) {
    el.innerHTML = '<div class="empty-msg">No service records yet.</div>';
    return;
  }
  el.innerHTML = sorted.map(m => `
    <div class="log-item">
      <div class="log-left">
        <div class="log-icon maint">🔧</div>
        <div>
          <div class="log-title">${m.type}</div>
          <div class="log-meta">${fmtDate(m.date)}${m.mileage ? ' · ' + m.mileage.toLocaleString() + ' mi' : ''}${m.notes ? ' · ' + m.notes : ''}</div>
        </div>
      </div>
      <div class="log-right">
        <div class="log-cost">${m.cost > 0 ? '£' + m.cost.toFixed(2) : '—'}</div>
      </div>
      <button class="log-del" onclick="deleteMaint('${m.id}')" title="Delete">✕</button>
    </div>
  `).join('');
}

// ─── SUMMARY ─────────────────────────────────────────────────
let currentPeriod = 'month';

function setPeriod(p) {
  currentPeriod = p;
  ['month','year','all'].forEach(x => {
    document.getElementById('pBtn-'+x).classList.toggle('active', x === p);
  });
  renderSummary();
}

function filterByPeriod(arr) {
  const now = new Date();
  return arr.filter(r => {
    const d = new Date(r.date);
    if (currentPeriod === 'month') {
      return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
    }
    if (currentPeriod === 'year') {
      return d.getFullYear() === now.getFullYear();
    }
    return true;
  });
}

function renderSummary() {
  const fuel  = filterByPeriod(state.fuel);
  const maint = filterByPeriod(state.maint);

  const fuelCost  = fuel.reduce((s,f) => s + f.cost, 0);
  const maintCost = maint.reduce((s,m) => s + m.cost, 0);
  const total     = fuelCost + maintCost;
  const litres    = fuel.reduce((s,f) => s + f.litres, 0);
  const mpgs      = fuel.filter(f => f.mpg).map(f => f.mpg);
  const avgMpg    = mpgs.length ? mpgs.reduce((a,b) => a+b,0) / mpgs.length : null;

  document.getElementById('summaryGrid').innerHTML = `
    <div class="stat-card">
      <div class="stat-label">Total Spend</div>
      <div class="stat-value accent">£${total.toFixed(2)}</div>
      <div class="stat-sub">${periodLabel()}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Fuel Cost</div>
      <div class="stat-value">£${fuelCost.toFixed(2)}</div>
      <div class="stat-sub">${fuel.length} fill-up${fuel.length !== 1 ? 's' : ''}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Service Cost</div>
      <div class="stat-value">£${maintCost.toFixed(2)}</div>
      <div class="stat-sub">${maint.length} record${maint.length !== 1 ? 's' : ''}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Avg MPG</div>
      <div class="stat-value green">${avgMpg ? avgMpg.toFixed(1) : '—'}</div>
      <div class="stat-sub">${litres.toFixed(1)}L used</div>
    </div>
  `;

  document.getElementById('breakdownTable').innerHTML = `
    <div class="breakdown-row"><span class="lbl">Fuel</span><span class="val">£${fuelCost.toFixed(2)}</span></div>
    <div class="breakdown-row"><span class="lbl">Maintenance</span><span class="val">£${maintCost.toFixed(2)}</span></div>
    <div class="breakdown-row total"><span class="lbl">Total</span><span class="val">£${total.toFixed(2)}</span></div>
  `;

  // MPG chart — last 8 fill-ups with MPG data
  const mpgEntries = state.fuel.filter(f=>f.mpg)
    .slice().sort((a,b)=>new Date(a.date)-new Date(b.date)).slice(-8);
  const maxMpg = mpgEntries.length ? Math.max(...mpgEntries.map(f=>f.mpg)) : 50;
  document.getElementById('mpgChart').innerHTML = mpgEntries.length
    ? mpgEntries.map(f => `
        <div class="mpg-bar-row">
          <div class="mpg-bar-label">${shortDate(f.date)}</div>
          <div class="mpg-bar-track">
            <div class="mpg-bar-fill" style="width:${(f.mpg/maxMpg*100).toFixed(1)}%"></div>
          </div>
          <div class="mpg-bar-val">${f.mpg.toFixed(1)}</div>
        </div>
      `).join('')
    : '<div class="empty-msg">Add fill-ups with mileage to see MPG trends.</div>';
}

function periodLabel() {
  if (currentPeriod === 'month') {
    return new Date().toLocaleString('default',{month:'long',year:'numeric'});
  }
  if (currentPeriod === 'year') return new Date().getFullYear();
  return 'All time';
}

// ─── UTILS ───────────────────────────────────────────────────
function today() {
  const d = new Date();
  return d.toISOString().slice(0,10);
}

function fmtDate(str) {
  if (!str) return '—';
  return new Date(str + 'T12:00:00').toLocaleDateString('en-GB', {day:'numeric',month:'short',year:'numeric'});
}

function shortDate(str) {
  if (!str) return '';
  return new Date(str + 'T12:00:00').toLocaleDateString('en-GB', {day:'numeric',month:'short'});
}

function closeModals() {
  document.querySelectorAll('.modal-backdrop').forEach(m => m.classList.remove('open'));
}

document.querySelectorAll('.modal-backdrop').forEach(backdrop => {
  backdrop.addEventListener('click', e => { if (e.target === backdrop) closeModals(); });
});

// ─── INIT ─────────────────────────────────────────────────────
load();
renderMileagePill();
renderFuelList();
renderMaintList();

// ─── SERVICE WORKER ──────────────────────────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}
</script>
</body>
</html>
