<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111418" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Qashqai Log</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    :root {
      --bg:        #111418;
      --surface:   #1a1f26;
      --surface2:  #222831;
      --border:    #2c333d;
      --accent:    #e8a020;
      --accent-dim:#3d2c08;
      --green:     #3ecf8e;
      --green-dim: #0d2d1f;
      --red:       #e85d5d;
      --red-dim:   #2d1010;
      --amber:     #f59e0b;
      --amber-dim: #2d1f04;
      --blue:      #60a5fa;
      --blue-dim:  #0d1e3a;
      --text:      #eaf0f8;
      --muted:     #6b7888;
      --label:     #9aa5b4;
      --radius:    10px;
      --radius-sm: 6px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      padding-bottom: 80px;
    }

    /* HEADER */
    header {
      position: sticky; top: 0; z-index: 100;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 14px 16px 12px;
    }
    .header-top { display: flex; align-items: center; justify-content: space-between; }
    .car-name { font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
    .car-sub  { font-size: 18px; font-weight: 700; color: var(--text); margin-top: 1px; }
    .mileage-pill {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 20px; padding: 5px 12px;
      font-size: 13px; font-weight: 600; color: var(--label);
      cursor: pointer; transition: border-color .15s;
    }
    .mileage-pill span { color: var(--text); }
    .mileage-pill:hover { border-color: var(--accent); }

    /* NAV */
    nav {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
      background: var(--surface); border-top: 1px solid var(--border);
      display: flex;
    }
    nav button {
      flex: 1; background: none; border: none; color: var(--muted);
      font-size: 10px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
      padding: 10px 0 calc(10px + env(safe-area-inset-bottom));
      cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px;
      transition: color .15s;
    }
    nav button.active { color: var(--accent); }
    nav button svg { width: 20px; height: 20px; }

    /* VIEWS */
    .view { display: none; padding: 16px; }
    .view.active { display: block; }

    /* INSIGHT CARDS */
    .insight-card {
      border-radius: var(--radius); padding: 14px 16px;
      margin-bottom: 10px; border: 1px solid;
      display: flex; align-items: flex-start; gap: 12px;
    }
    .insight-card.green  { background: var(--green-dim);  border-color: #1a5c3a; }
    .insight-card.amber  { background: var(--amber-dim);  border-color: #6b420a; }
    .insight-card.red    { background: var(--red-dim);    border-color: #6b1a1a; }
    .insight-card.blue   { background: var(--blue-dim);   border-color: #1a3a6b; }
    .insight-card.neutral{ background: var(--surface);    border-color: var(--border); }
    .insight-icon { font-size: 20px; flex-shrink: 0; margin-top: 1px; }
    .insight-body {}
    .insight-title { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 3px; }
    .insight-text  { font-size: 12px; color: var(--label); line-height: 1.5; }
    .insight-text strong { color: var(--text); }

    /* SERVICE REMINDER BANNER */
    .service-banner {
      border-radius: var(--radius); padding: 14px 16px;
      margin-bottom: 10px; border: 1px solid;
    }
    .service-banner.ok     { background: var(--green-dim);  border-color: #1a5c3a; }
    .service-banner.soon   { background: var(--amber-dim);  border-color: #6b420a; }
    .service-banner.overdue{ background: var(--red-dim);    border-color: #6b1a1a; }
    .banner-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .banner-label { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .banner-label.ok      { color: var(--green); }
    .banner-label.soon    { color: var(--amber); }
    .banner-label.overdue { color: var(--red); }
    .banner-edit { font-size: 11px; color: var(--muted); text-decoration: underline; cursor: pointer; }
    .banner-progress-track {
      height: 6px; background: var(--surface2); border-radius: 3px; margin-bottom: 10px; overflow: hidden;
    }
    .banner-progress-fill { height: 100%; border-radius: 3px; transition: width .5s; }
    .banner-fill-ok     { background: var(--green); }
    .banner-fill-soon   { background: var(--amber); }
    .banner-fill-overdue{ background: var(--red); }
    .banner-stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
    .banner-stat { text-align: center; }
    .banner-stat-val { font-size: 15px; font-weight: 800; color: var(--text); }
    .banner-stat-lbl { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-top: 1px; }

    /* STAT CARDS */
    .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px; }
    .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; }
    .stat-card.wide { grid-column: 1 / -1; }
    .stat-label { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
    .stat-value { font-size: 26px; font-weight: 800; color: var(--text); line-height: 1; }
    .stat-value.accent { color: var(--accent); }
    .stat-value.green  { color: var(--green); }
    .stat-value.red    { color: var(--red); }
    .stat-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .trend-arrow { font-size: 13px; margin-left: 4px; }

    /* SECTION HDR */
    .section-hdr { display: flex; align-items: center; justify-content: space-between; margin: 18px 0 10px; }
    .section-title { font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--label); }
    .btn-add {
      background: var(--accent); color: #000; border: none;
      border-radius: var(--radius-sm); padding: 6px 12px;
      font-size: 13px; font-weight: 700; cursor: pointer; transition: opacity .15s;
    }
    .btn-add:hover { opacity: .85; }

    /* LOG LIST */
    .log-list { display: flex; flex-direction: column; gap: 8px; }
    .log-item {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 12px 14px;
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
    }
    .log-item:active { opacity: .75; }
    .log-left { display: flex; align-items: center; gap: 10px; }
    .log-icon {
      width: 36px; height: 36px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; font-size: 16px;
    }
    .log-icon.fuel  { background: var(--accent-dim); }
    .log-icon.maint { background: var(--green-dim); }
    .log-title { font-size: 14px; font-weight: 600; color: var(--text); }
    .log-meta  { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .log-right { text-align: right; flex-shrink: 0; }
    .log-cost  { font-size: 15px; font-weight: 700; color: var(--text); }
    .log-mpg   { font-size: 12px; color: var(--green); margin-top: 2px; }
    .log-mpg.red { color: var(--red); }
    .log-del   {
      background: none; border: none; color: var(--muted);
      cursor: pointer; padding: 4px; border-radius: 4px; font-size: 14px; line-height: 1;
    }
    .log-del:hover { color: var(--red); }
    .empty-msg { text-align: center; color: var(--muted); font-size: 14px; padding: 32px 0; }

    /* MODAL */
    .modal-backdrop {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.7); z-index: 200; align-items: flex-end;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: var(--surface); border-top: 1px solid var(--border);
      border-radius: 16px 16px 0 0;
      padding: 20px 16px calc(20px + env(safe-area-inset-bottom));
      width: 100%; max-height: 92dvh; overflow-y: auto;
    }
    .modal-title { font-size: 17px; font-weight: 700; margin-bottom: 18px; }
    .field { margin-bottom: 14px; }
    .field label {
      display: block; font-size: 12px; font-weight: 600;
      letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px;
    }
    .field input, .field select, .field textarea {
      width: 100%; background: var(--surface2); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 10px 12px;
      font-size: 15px; color: var(--text); font-family: inherit; outline: none;
      transition: border-color .15s; -webkit-appearance: none;
    }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
    .field textarea { resize: vertical; min-height: 70px; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .modal-actions { display: flex; gap: 10px; margin-top: 6px; }
    .btn-primary {
      flex: 1; background: var(--accent); color: #000; border: none;
      border-radius: var(--radius-sm); padding: 13px;
      font-size: 15px; font-weight: 700; cursor: pointer;
    }
    .btn-cancel {
      background: var(--surface2); color: var(--label); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 13px 18px;
      font-size: 15px; font-weight: 600; cursor: pointer;
    }
    .calc-hint {
      font-size: 12px; color: var(--blue); min-height: 16px; margin-bottom: 4px;
    }
    .fuel-preview {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 10px 12px;
      margin-bottom: 14px; display: flex; gap: 16px; flex-wrap: wrap;
    }
    .fp-item { display: flex; flex-direction: column; }
    .fp-val { font-size: 16px; font-weight: 800; color: var(--text); }
    .fp-val.green { color: var(--green); }
    .fp-val.red   { color: var(--red); }
    .fp-lbl { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-top: 2px; }

    /* PERIOD TOGGLE */
    .period-toggle {
      display: flex; background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 3px; gap: 3px; margin-bottom: 14px;
    }
    .period-btn {
      flex: 1; background: none; border: none; color: var(--muted);
      font-size: 13px; font-weight: 600; padding: 8px 4px; border-radius: 7px;
      cursor: pointer; transition: all .15s;
    }
    .period-btn.active { background: var(--accent-dim); color: var(--accent); }

    /* BREAKDOWN */
    .breakdown { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 10px; }
    .breakdown-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 11px 14px; border-bottom: 1px solid var(--border); font-size: 14px;
    }
    .breakdown-row:last-child { border-bottom: none; }
    .breakdown-row .lbl { color: var(--label); }
    .breakdown-row .val { font-weight: 700; }
    .breakdown-row.total .lbl { color: var(--text); font-weight: 700; }
    .breakdown-row.total .val { color: var(--accent); font-size: 16px; }

    /* MPG CHART */
    .mpg-chart { margin-top: 4px; }
    .mpg-bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
    .mpg-bar-label { font-size: 11px; color: var(--muted); width: 60px; flex-shrink: 0; }
    .mpg-bar-track { flex: 1; height: 8px; background: var(--surface2); border-radius: 4px; overflow: hidden; }
    .mpg-bar-fill  { height: 100%; border-radius: 4px; transition: width .4s; }
    .mpg-bar-fill.good { background: var(--green); }
    .mpg-bar-fill.avg  { background: var(--amber); }
    .mpg-bar-fill.poor { background: var(--red); }
    .mpg-bar-val { font-size: 12px; font-weight: 700; width: 44px; text-align: right; }
    .mpg-bar-val.good { color: var(--green); }
    .mpg-bar-val.avg  { color: var(--amber); }
    .mpg-bar-val.poor { color: var(--red); }

    /* NEXT SERVICE SETTINGS */
    .settings-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 14px; border-bottom: 1px solid var(--border);
    }
    .settings-row:last-child { border-bottom: none; }
    .settings-lbl { font-size: 14px; color: var(--label); }
    .settings-val { font-size: 14px; font-weight: 700; color: var(--text); }
  </style>
</head>
<body>

<header>
  <div class="header-top">
    <div>
      <div class="car-name">Qashqai Log</div>
      <div class="car-sub">2009 Nissan Qashqai 1.6</div>
    </div>
    <button class="mileage-pill" id="mileagePill" onclick="openMileageModal()">
      <span id="currentMileage">—</span> mi
    </button>
  </div>
</header>

<main>
  <!-- FUEL VIEW -->
  <section class="view active" id="view-fuel">
    <div class="section-hdr" style="margin-top:6px">
      <span class="section-title">Fuel Log</span>
      <button class="btn-add" onclick="openFuelModal()">+ Add Fill-up</button>
    </div>
    <div class="log-list" id="fuelList"></div>
  </section>

  <!-- MAINTENANCE VIEW -->
  <section class="view" id="view-maint">
    <div id="serviceBanner" style="margin-top:6px"></div>
    <div class="section-hdr">
      <span class="section-title">Service Records</span>
      <button class="btn-add" onclick="openMaintModal()">+ Add Record</button>
    </div>
    <div class="log-list" id="maintList"></div>
  </section>

  <!-- INSIGHTS VIEW -->
  <section class="view" id="view-insights">
    <div style="margin-top:6px" id="insightsPanel"></div>
  </section>

  <!-- SUMMARY VIEW -->
  <section class="view" id="view-summary">
    <div style="margin-top:6px"></div>
    <div class="period-toggle">
      <button class="period-btn active" id="pBtn-month" onclick="setPeriod('month')">Month</button>
      <button class="period-btn" id="pBtn-year"  onclick="setPeriod('year')">Year</button>
      <button class="period-btn" id="pBtn-all"   onclick="setPeriod('all')">All Time</button>
    </div>
    <div class="summary-grid" id="summaryGrid"></div>
    <div class="section-title" style="margin-bottom:10px">Cost Breakdown</div>
    <div class="breakdown" id="breakdownTable"></div>
    <div class="section-title" style="margin: 16px 0 10px">MPG History</div>
    <div class="mpg-chart" id="mpgChart"></div>
  </section>
</main>

<!-- NAV -->
<nav>
  <button class="active" id="tab-fuel" onclick="switchTab('fuel')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 22V10l7-7 7 7v12H3z"/><path d="M10 22v-6h4v6"/><path d="M20 10h1a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-1"/>
    </svg>
    Fuel
  </button>
  <button id="tab-maint" onclick="switchTab('maint')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
    </svg>
    Service
  </button>
  <button id="tab-insights" onclick="switchTab('insights')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
    </svg>
    Insights
  </button>
  <button id="tab-summary" onclick="switchTab('summary')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/>
    </svg>
    Summary
  </button>
</nav>

<!-- FUEL MODAL -->
<div class="modal-backdrop" id="fuelModal">
  <div class="modal">
    <div class="modal-title">Add Fill-up</div>
    <div class="field-row">
      <div class="field">
        <label>Date</label>
        <input type="date" id="f-date" />
      </div>
      <div class="field">
        <label>Mileage (mi)</label>
        <input type="number" id="f-mileage" placeholder="e.g. 87500" oninput="calcFuelPreview()" />
      </div>
    </div>
    <div class="calc-hint" id="fuelMileageHint"></div>
    <div class="field-row">
      <div class="field">
        <label>Litres</label>
        <input type="number" id="f-litres" step="0.01" placeholder="e.g. 45.2" oninput="calcFuelPreview()" />
      </div>
      <div class="field">
        <label>Total Cost (£)</label>
        <input type="number" id="f-cost" step="0.01" placeholder="e.g. 68.50" oninput="calcFuelPreview()" />
      </div>
    </div>
    <div class="field">
      <label>Previous Mileage (mi)</label>
      <input type="number" id="f-prev-mileage" placeholder="auto-filled from last fill-up" oninput="calcFuelPreview()" />
    </div>
    <div id="fuelPreviewBox" style="display:none" class="fuel-preview">
      <div class="fp-item"><div class="fp-val" id="fp-mpg">—</div><div class="fp-lbl">MPG</div></div>
      <div class="fp-item"><div class="fp-val" id="fp-ppl">—</div><div class="fp-lbl">p/litre</div></div>
      <div class="fp-item"><div class="fp-val" id="fp-miles">—</div><div class="fp-lbl">Miles driven</div></div>
      <div class="fp-item"><div class="fp-val" id="fp-trend">—</div><div class="fp-lbl">vs avg MPG</div></div>
    </div>
    <div class="field">
      <label>Notes</label>
      <input type="text" id="f-notes" placeholder="e.g. Shell, motorway run" />
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModals()">Cancel</button>
      <button class="btn-primary" onclick="saveFuel()">Save</button>
    </div>
  </div>
</div>

<!-- MAINT MODAL -->
<div class="modal-backdrop" id="maintModal">
  <div class="modal">
    <div class="modal-title">Add Service Record</div>
    <div class="field-row">
      <div class="field">
        <label>Date</label>
        <input type="date" id="m-date" />
      </div>
      <div class="field">
        <label>Mileage (mi)</label>
        <input type="number" id="m-mileage" placeholder="e.g. 87500" />
      </div>
    </div>
    <div class="field">
      <label>Service Type</label>
      <select id="m-type">
        <option value="Oil Change">Oil Change</option>
        <option value="Tyre Rotation">Tyre Rotation</option>
        <option value="Tyre Replacement">Tyre Replacement</option>
        <option value="Brake Service">Brake Service</option>
        <option value="Air Filter">Air Filter</option>
        <option value="Spark Plugs">Spark Plugs</option>
        <option value="Battery">Battery</option>
        <option value="MOT">MOT</option>
        <option value="Service (Full)">Service (Full)</option>
        <option value="Service (Interim)">Service (Interim)</option>
        <option value="Other">Other</option>
      </select>
    </div>
    <div class="field">
      <label>Cost (£)</label>
      <input type="number" id="m-cost" step="0.01" placeholder="e.g. 35.00" />
    </div>
    <div class="field">
      <label>Next Service Mileage (optional)</label>
      <input type="number" id="m-next-mileage" placeholder="e.g. 91500" />
    </div>
    <div class="field">
      <label>Next Service Date (optional)</label>
      <input type="date" id="m-next-date" />
    </div>
    <div class="field">
      <label>Notes</label>
      <textarea id="m-notes" placeholder="e.g. Castrol Edge 5W-30 A3/B4, 4.2L"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModals()">Cancel</button>
      <button class="btn-primary" onclick="saveMaint()">Save</button>
    </div>
  </div>
</div>

<!-- MILEAGE MODAL -->
<div class="modal-backdrop" id="mileageModal">
  <div class="modal">
    <div class="modal-title">Update Odometer</div>
    <div class="field">
      <label>Current Mileage (mi)</label>
      <input type="number" id="mm-val" placeholder="e.g. 88000" />
    </div>
    <div class="calc-hint" id="mileageCalcHint" style="margin-bottom:10px"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModals()">Cancel</button>
      <button class="btn-primary" onclick="saveMileage()">Save</button>
    </div>
  </div>
</div>

<!-- SERVICE SETTINGS MODAL -->
<div class="modal-backdrop" id="serviceSettingsModal">
  <div class="modal">
    <div class="modal-title">Next Service Settings</div>
    <div class="field">
      <label>Next Service Mileage (mi)</label>
      <input type="number" id="ss-mileage" placeholder="e.g. 91500" />
    </div>
    <div class="field">
      <label>Next Service Date</label>
      <input type="date" id="ss-date" />
    </div>
    <div class="field">
      <label>Service Interval (miles)</label>
      <input type="number" id="ss-interval" placeholder="e.g. 6000" />
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModals()">Cancel</button>
      <button class="btn-primary" onclick="saveServiceSettings()">Save</button>
    </div>
  </div>
</div>

<script>
// ─── STATE ───────────────────────────────────────────────────────────────────
let state = {
  mileage: 0,
  fuel:  [],   // { id, date, mileage, litres, cost, prevMileage, mpg, notes }
  maint: [],   // { id, date, mileage, type, cost, nextMileage, nextDate, notes }
  service: {   // next service config
    nextMileage: null,
    nextDate: null,
    intervalMiles: 6000
  }
};

function load() {
  const raw = localStorage.getItem('qashqai-log');
  if (raw) {
    const parsed = JSON.parse(raw);
    state = { ...state, ...parsed };
    if (!state.service) state.service = { nextMileage: null, nextDate: null, intervalMiles: 6000 };
  }
}
function save() { localStorage.setItem('qashqai-log', JSON.stringify(state)); }
function uid()  { return Date.now().toString(36) + Math.random().toString(36).slice(2); }

// ─── TABS ────────────────────────────────────────────────────────────────────
let currentTab = 'fuel';
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.getElementById('view-' + tab).classList.add('active');
  document.getElementById('tab-' + tab).classList.add('active');
  if (tab === 'summary')  renderSummary();
  if (tab === 'insights') renderInsights();
  if (tab === 'maint')    renderServiceBanner();
}

// ─── MILEAGE ─────────────────────────────────────────────────────────────────
function openMileageModal() {
  document.getElementById('mm-val').value = state.mileage || '';
  // Show estimated mileage based on avg daily miles
  const hint = estimatedMileageToday();
  document.getElementById('mileageCalcHint').textContent = hint
    ? '💡 Estimated today: ' + hint.toLocaleString() + ' mi (based on avg daily mileage)'
    : '';
  document.getElementById('mileageModal').classList.add('open');
  setTimeout(() => document.getElementById('mm-val').focus(), 80);
}

function estimatedMileageToday() {
  // Use last two mileage points to estimate current mileage
  const points = state.fuel.filter(f => f.mileage && f.date)
    .slice().sort((a,b) => new Date(a.date)-new Date(b.date));
  if (points.length < 2) return null;
  const last  = points[points.length - 1];
  const prev  = points[points.length - 2];
  const daysBetween = (new Date(last.date) - new Date(prev.date)) / 86400000;
  if (daysBetween <= 0) return null;
  const dailyMiles = (last.mileage - prev.mileage) / daysBetween;
  const daysSinceLast = (new Date() - new Date(last.date + 'T12:00:00')) / 86400000;
  return Math.round(last.mileage + dailyMiles * daysSinceLast);
}

function saveMileage() {
  const v = parseInt(document.getElementById('mm-val').value);
  if (!v || v < 0) return;
  state.mileage = v;
  save();
  renderMileagePill();
  closeModals();
}

function renderMileagePill() {
  document.getElementById('currentMileage').textContent =
    state.mileage ? state.mileage.toLocaleString() : '—';
}

// ─── FUEL ─────────────────────────────────────────────────────────────────────
function openFuelModal() {
  document.getElementById('f-date').value = today();
  document.getElementById('f-mileage').value = '';
  document.getElementById('f-litres').value = '';
  document.getElementById('f-cost').value = '';
  document.getElementById('f-notes').value = '';
  // Auto-fill previous mileage from last fill-up
  const last = lastFuelEntry();
  document.getElementById('f-prev-mileage').value = last ? last.mileage || '' : '';
  // Show estimated current mileage as hint
  const est = estimatedMileageToday();
  document.getElementById('fuelMileageHint').textContent = est
    ? '💡 Estimated current: ' + est.toLocaleString() + ' mi'
    : '';
  document.getElementById('fuelPreviewBox').style.display = 'none';
  document.getElementById('fuelModal').classList.add('open');
}

function lastFuelEntry() {
  if (!state.fuel.length) return null;
  return state.fuel.slice().sort((a,b) => new Date(b.date)-new Date(a.date))[0];
}

function avgMpg(excludeId) {
  const entries = state.fuel.filter(f => f.mpg && f.id !== excludeId);
  if (!entries.length) return null;
  return entries.reduce((s,f) => s+f.mpg, 0) / entries.length;
}

function calcFuelPreview() {
  const litres  = parseFloat(document.getElementById('f-litres').value);
  const cost    = parseFloat(document.getElementById('f-cost').value);
  const cur     = parseFloat(document.getElementById('f-mileage').value);
  const prev    = parseFloat(document.getElementById('f-prev-mileage').value);
  const box     = document.getElementById('fuelPreviewBox');

  if (!litres && !cost && !cur) { box.style.display='none'; return; }
  box.style.display = 'flex';

  // Miles driven
  const miles = (cur && prev && cur > prev) ? cur - prev : null;
  document.getElementById('fp-miles').textContent = miles ? miles.toLocaleString() : '—';
  document.getElementById('fp-miles').className   = 'fp-val';

  // MPG
  let mpgVal = null;
  if (miles && litres) {
    mpgVal = (miles / litres) * 4.54609;
    const el = document.getElementById('fp-mpg');
    el.textContent = mpgVal.toFixed(1);
    const avg = avgMpg(null);
    if (avg) {
      el.className = mpgVal >= avg * 0.97 ? 'fp-val green' : 'fp-val red';
    } else {
      el.className = 'fp-val';
    }
  } else {
    document.getElementById('fp-mpg').textContent = '—';
    document.getElementById('fp-mpg').className   = 'fp-val';
  }

  // p/litre
  if (litres && cost) {
    document.getElementById('fp-ppl').textContent = ((cost / litres) * 100).toFixed(1) + 'p';
  } else {
    document.getElementById('fp-ppl').textContent = '—';
  }

  // vs avg trend
  const avg = avgMpg(null);
  const trendEl = document.getElementById('fp-trend');
  if (mpgVal && avg) {
    const diff = mpgVal - avg;
    trendEl.textContent = (diff >= 0 ? '+' : '') + diff.toFixed(1);
    trendEl.className   = diff >= 0 ? 'fp-val green' : 'fp-val red';
  } else {
    trendEl.textContent = '—';
    trendEl.className   = 'fp-val';
  }
}

function saveFuel() {
  const date  = document.getElementById('f-date').value;
  const mi    = parseFloat(document.getElementById('f-mileage').value);
  const lit   = parseFloat(document.getElementById('f-litres').value);
  const cost  = parseFloat(document.getElementById('f-cost').value);
  const prev  = parseFloat(document.getElementById('f-prev-mileage').value);
  const notes = document.getElementById('f-notes').value.trim();
  if (!date || !lit || !cost) { alert('Date, litres and cost are required.'); return; }
  let mpg = null;
  if (prev && mi && mi > prev) mpg = ((mi - prev) / lit) * 4.54609;
  state.fuel.push({ id: uid(), date, mileage: mi || null, litres: lit, cost, prevMileage: prev || null, mpg, notes });
  if (mi && mi > (state.mileage || 0)) state.mileage = mi;
  save(); renderMileagePill(); renderFuelList(); closeModals();
}

function deleteFuel(id) {
  if (!confirm('Delete this fill-up?')) return;
  state.fuel = state.fuel.filter(f => f.id !== id);
  save(); renderFuelList();
}

function renderFuelList() {
  const el = document.getElementById('fuelList');
  const sorted = state.fuel.slice().sort((a,b) => new Date(b.date)-new Date(a.date));
  if (!sorted.length) {
    el.innerHTML = '<div class="empty-msg">No fill-ups yet. Add your first one.</div>';
    return;
  }
  const avg = avgMpg(null);
  el.innerHTML = sorted.map(f => {
    let mpgClass = '';
    if (f.mpg && avg) mpgClass = f.mpg >= avg * 0.97 ? '' : 'red';
    return `
    <div class="log-item">
      <div class="log-left">
        <div class="log-icon fuel">⛽</div>
        <div>
          <div class="log-title">${fmtDate(f.date)}</div>
          <div class="log-meta">${f.litres}L${f.mileage ? ' · ' + f.mileage.toLocaleString() + ' mi' : ''}${f.notes ? ' · ' + f.notes : ''}</div>
        </div>
      </div>
      <div class="log-right">
        <div class="log-cost">£${f.cost.toFixed(2)}</div>
        ${f.mpg ? `<div class="log-mpg ${mpgClass}">${f.mpg.toFixed(1)} MPG</div>` : ''}
      </div>
      <button class="log-del" onclick="deleteFuel('${f.id}')" title="Delete">✕</button>
    </div>`;
  }).join('');
}

// ─── MAINTENANCE ──────────────────────────────────────────────────────────────
function openMaintModal() {
  document.getElementById('m-date').value = today();
  document.getElementById('m-mileage').value = state.mileage || '';
  document.getElementById('m-type').value = 'Oil Change';
  document.getElementById('m-cost').value = '';
  document.getElementById('m-next-mileage').value =
    state.mileage && state.service.intervalMiles
      ? state.mileage + state.service.intervalMiles
      : '';
  document.getElementById('m-next-date').value = '';
  document.getElementById('m-notes').value = '';
  document.getElementById('maintModal').classList.add('open');
}

function saveMaint() {
  const date       = document.getElementById('m-date').value;
  const mi         = parseFloat(document.getElementById('m-mileage').value);
  const type       = document.getElementById('m-type').value;
  const cost       = parseFloat(document.getElementById('m-cost').value);
  const nextMil    = parseFloat(document.getElementById('m-next-mileage').value);
  const nextDate   = document.getElementById('m-next-date').value;
  const notes      = document.getElementById('m-notes').value.trim();
  if (!date || !type) { alert('Date and type are required.'); return; }
  state.maint.push({ id: uid(), date, mileage: mi || null, type, cost: cost || 0, nextMileage: nextMil || null, nextDate: nextDate || null, notes });
  // Update next service settings from the most recent entry that has them
  if (nextMil) state.service.nextMileage = nextMil;
  if (nextDate) state.service.nextDate = nextDate;
  if (mi && mi > (state.mileage || 0)) state.mileage = mi;
  save(); renderMileagePill(); renderMaintList(); renderServiceBanner(); closeModals();
}

function deleteMaint(id) {
  if (!confirm('Delete this record?')) return;
  state.maint = state.maint.filter(m => m.id !== id);
  save(); renderMaintList(); renderServiceBanner();
}

function renderMaintList() {
  const el = document.getElementById('maintList');
  const sorted = state.maint.slice().sort((a,b) => new Date(b.date)-new Date(a.date));
  if (!sorted.length) {
    el.innerHTML = '<div class="empty-msg">No service records yet.</div>';
    return;
  }
  el.innerHTML = sorted.map(m => `
    <div class="log-item">
      <div class="log-left">
        <div class="log-icon maint">🔧</div>
        <div>
          <div class="log-title">${m.type}</div>
          <div class="log-meta">${fmtDate(m.date)}${m.mileage ? ' · ' + m.mileage.toLocaleString() + ' mi' : ''}${m.notes ? ' · ' + m.notes : ''}</div>
          ${m.nextMileage || m.nextDate ? `<div class="log-meta" style="color:var(--amber)">Next: ${m.nextMileage ? m.nextMileage.toLocaleString() + ' mi' : ''}${m.nextMileage && m.nextDate ? ' · ' : ''}${m.nextDate ? fmtDate(m.nextDate) : ''}</div>` : ''}
        </div>
      </div>
      <div class="log-right">
        <div class="log-cost">${m.cost > 0 ? '£' + m.cost.toFixed(2) : '—'}</div>
      </div>
      <button class="log-del" onclick="deleteMaint('${m.id}')" title="Delete">✕</button>
    </div>
  `).join('');
}

// ─── SERVICE BANNER ───────────────────────────────────────────────────────────
function openServiceSettingsModal() {
  document.getElementById('ss-mileage').value  = state.service.nextMileage || '';
  document.getElementById('ss-date').value     = state.service.nextDate || '';
  document.getElementById('ss-interval').value = state.service.intervalMiles || 6000;
  document.getElementById('serviceSettingsModal').classList.add('open');
}

function saveServiceSettings() {
  state.service.nextMileage  = parseFloat(document.getElementById('ss-mileage').value) || null;
  state.service.nextDate     = document.getElementById('ss-date').value || null;
  state.service.intervalMiles = parseFloat(document.getElementById('ss-interval').value) || 6000;
  save(); renderServiceBanner(); closeModals();
}

function renderServiceBanner() {
  const el = document.getElementById('serviceBanner');
  const { nextMileage, nextDate, intervalMiles } = state.service;
  const cur = state.mileage;

  if (!nextMileage && !nextDate) {
    el.innerHTML = `
      <div class="insight-card neutral">
        <div class="insight-icon">🔧</div>
        <div class="insight-body">
          <div class="insight-title">Next Service</div>
          <div class="insight-text">No service reminder set. <span style="color:var(--accent);cursor:pointer" onclick="openServiceSettingsModal()">Set one →</span></div>
        </div>
      </div>`;
    return;
  }

  // Mileage progress
  let milesLeft = null, pct = 0, status = 'ok';
  if (nextMileage && cur) {
    milesLeft = nextMileage - cur;
    const interval = intervalMiles || 6000;
    pct = Math.min(100, Math.max(0, ((interval - milesLeft) / interval) * 100));
    if (milesLeft <= 0)   status = 'overdue';
    else if (milesLeft < 500) status = 'soon';
    else status = 'ok';
  }

  // Date progress
  let daysLeft = null;
  if (nextDate) {
    daysLeft = Math.ceil((new Date(nextDate + 'T12:00:00') - new Date()) / 86400000);
    if (daysLeft <= 0 && status !== 'overdue') status = 'overdue';
    else if (daysLeft <= 30 && status === 'ok') status = 'soon';
  }

  // Estimated date from avg daily mileage
  let estDateStr = '';
  if (milesLeft > 0) {
    const dailyMi = avgDailyMiles();
    if (dailyMi > 0) {
      const daysToService = Math.ceil(milesLeft / dailyMi);
      const estDate = new Date();
      estDate.setDate(estDate.getDate() + daysToService);
      estDateStr = estDate.toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' });
    }
  }

  const labelMap   = { ok:'On Track', soon:'Due Soon', overdue:'Overdue' };
  const label      = labelMap[status];

  el.innerHTML = `
    <div class="service-banner ${status}">
      <div class="banner-top">
        <span class="banner-label ${status}">${label}</span>
        <span class="banner-edit" onclick="openServiceSettingsModal()">Edit reminder</span>
      </div>
      ${nextMileage && cur ? `
        <div class="banner-progress-track">
          <div class="banner-progress-fill banner-fill-${status}" style="width:${pct.toFixed(1)}%"></div>
        </div>` : ''}
      <div class="banner-stats">
        ${nextMileage ? `<div class="banner-stat">
          <div class="banner-stat-val">${milesLeft !== null ? (milesLeft > 0 ? milesLeft.toLocaleString() : 'Overdue') : '—'}</div>
          <div class="banner-stat-lbl">Miles left</div>
        </div>` : '<div class="banner-stat"></div>'}
        ${nextDate ? `<div class="banner-stat">
          <div class="banner-stat-val">${daysLeft !== null ? (daysLeft > 0 ? daysLeft + 'd' : 'Past due') : '—'}</div>
          <div class="banner-stat-lbl">Days left</div>
        </div>` : '<div class="banner-stat"></div>'}
        <div class="banner-stat">
          <div class="banner-stat-val" style="font-size:12px;font-weight:600">${estDateStr || (nextMileage ? nextMileage.toLocaleString() + ' mi' : '—')}</div>
          <div class="banner-stat-lbl">${estDateStr ? 'Est. date' : 'Target'}</div>
        </div>
      </div>
    </div>`;
}

// ─── INSIGHTS ─────────────────────────────────────────────────────────────────
function renderInsights() {
  const el = document.getElementById('insightsPanel');
  const cards = [];

  const fuelSorted = state.fuel.filter(f=>f.mpg).slice().sort((a,b)=>new Date(a.date)-new Date(b.date));
  const allMpgs    = fuelSorted.map(f=>f.mpg);
  const avg        = allMpgs.length ? allMpgs.reduce((a,b)=>a+b,0)/allMpgs.length : null;
  const recent5    = fuelSorted.slice(-5).map(f=>f.mpg);
  const recent5avg = recent5.length ? recent5.reduce((a,b)=>a+b,0)/recent5.length : null;
  const dailyMi    = avgDailyMiles();

  // ── MPG Trend
  if (fuelSorted.length >= 3) {
    const first3avg = fuelSorted.slice(0,3).map(f=>f.mpg).reduce((a,b)=>a+b,0)/3;
    const last3avg  = fuelSorted.slice(-3).map(f=>f.mpg).reduce((a,b)=>a+b,0)/3;
    const diff      = last3avg - first3avg;
    const pct       = ((diff/first3avg)*100).toFixed(1);
    if (Math.abs(diff) > 0.5) {
      cards.push({
        color: diff > 0 ? 'green' : 'red',
        icon:  diff > 0 ? '📈' : '📉',
        title: diff > 0 ? 'MPG improving' : 'MPG declining',
        text:  `Your recent average is <strong>${last3avg.toFixed(1)} MPG</strong>, ${diff > 0 ? 'up' : 'down'} <strong>${Math.abs(pct)}%</strong> from your first few fill-ups (${first3avg.toFixed(1)} MPG). ${diff < 0 ? 'Consider checking tyre pressures or air filter.' : 'Keep it up.'}`
      });
    } else {
      cards.push({
        color: 'neutral', icon: '➡️', title: 'MPG consistent',
        text: `Your efficiency has been stable at around <strong>${avg.toFixed(1)} MPG</strong> across all recorded fill-ups.`
      });
    }
  }

  // ── Best / worst fill-up
  if (allMpgs.length >= 2) {
    const best  = fuelSorted.reduce((a,b)=>a.mpg>b.mpg?a:b);
    const worst = fuelSorted.reduce((a,b)=>a.mpg<b.mpg?a:b);
    cards.push({
      color: 'blue', icon: '🏆', title: 'Best & worst fill-up',
      text: `Best: <strong>${best.mpg.toFixed(1)} MPG</strong> on ${fmtDate(best.date)}${best.notes?' ('+best.notes+')':''}. Worst: <strong>${worst.mpg.toFixed(1)} MPG</strong> on ${fmtDate(worst.date)}${worst.notes?' ('+worst.notes+')':''}. Difference of <strong>${(best.mpg-worst.mpg).toFixed(1)} MPG</strong>.`
    });
  }

  // ── Avg cost per mile
  const totalFuelCost = state.fuel.reduce((s,f)=>s+f.cost,0);
  const totalMiles    = state.fuel.filter(f=>f.mileage&&f.prevMileage).reduce((s,f)=>s+(f.mileage-f.prevMileage),0);
  if (totalMiles > 0) {
    const cpm = (totalFuelCost / totalMiles * 100).toFixed(1);
    cards.push({
      color: 'neutral', icon: '💷', title: 'Fuel cost per mile',
      text: `You're paying roughly <strong>${cpm}p per mile</strong> in fuel across ${totalMiles.toLocaleString()} tracked miles. Total fuel spend logged: <strong>£${totalFuelCost.toFixed(2)}</strong>.`
    });
  }

  // ── Avg daily mileage + projection
  if (dailyMi > 0) {
    const annualMi = Math.round(dailyMi * 365);
    cards.push({
      color: 'blue', icon: '🗺️', title: 'Mileage projection',
      text: `Based on your fill-up history, you're averaging <strong>${Math.round(dailyMi)} miles/day</strong> — roughly <strong>${annualMi.toLocaleString()} miles/year</strong>. ${annualMi > 12000 ? 'Higher than average UK mileage (12,000/yr).' : 'Below average UK mileage (12,000/yr).'}`
    });

    // Estimated cost for rest of year
    if (avg && totalFuelCost && totalMiles) {
      const cpm = totalFuelCost / totalMiles;
      const now  = new Date();
      const eoy  = new Date(now.getFullYear(), 11, 31);
      const daysLeft = Math.ceil((eoy - now) / 86400000);
      const projMiles = dailyMi * daysLeft;
      const projCost  = (projMiles * cpm).toFixed(0);
      cards.push({
        color: 'amber', icon: '📅', title: 'Projected fuel cost to year-end',
        text: `At your current rate, you'll drive roughly <strong>${Math.round(projMiles).toLocaleString()} more miles</strong> this year, costing an estimated <strong>£${projCost}</strong> in fuel.`
      });
    }
  }

  // ── Fuel price trend
  const withPpl = state.fuel.filter(f=>f.litres&&f.cost).slice().sort((a,b)=>new Date(a.date)-new Date(b.date));
  if (withPpl.length >= 3) {
    const ppls = withPpl.map(f=>(f.cost/f.litres)*100);
    const first3ppl = ppls.slice(0,3).reduce((a,b)=>a+b,0)/3;
    const last3ppl  = ppls.slice(-3).reduce((a,b)=>a+b,0)/3;
    const diff = last3ppl - first3ppl;
    if (Math.abs(diff) > 2) {
      cards.push({
        color: diff < 0 ? 'green' : 'amber', icon: diff < 0 ? '⬇️' : '⬆️',
        title: 'Fuel price ' + (diff < 0 ? 'dropping' : 'rising'),
        text: `Your average fuel price has ${diff < 0 ? 'decreased' : 'increased'} from <strong>${first3ppl.toFixed(1)}p/L</strong> to <strong>${last3ppl.toFixed(1)}p/L</strong> — a change of <strong>${Math.abs(diff).toFixed(1)}p/L</strong>.`
      });
    }
  }

  // ── Service reminder nudge
  const { nextMileage, nextDate } = state.service;
  if (nextMileage && state.mileage) {
    const left = nextMileage - state.mileage;
    if (left > 0 && dailyMi > 0) {
      const daysToService = Math.ceil(left / dailyMi);
      const estDate = new Date();
      estDate.setDate(estDate.getDate() + daysToService);
      cards.push({
        color: left < 500 ? 'amber' : 'neutral', icon: '🔧', title: 'Next service estimate',
        text: `At your current mileage rate, you'll reach your next service in approximately <strong>${daysToService} days</strong> (around <strong>${estDate.toLocaleDateString('en-GB',{day:'numeric',month:'long'})}</strong>). ${left.toLocaleString()} miles remaining.`
      });
    }
  }

  // ── No data fallback
  if (!cards.length) {
    el.innerHTML = '<div class="empty-msg" style="padding-top:60px">Add fill-ups to start seeing insights.</div>';
    return;
  }

  el.innerHTML = `
    <div class="section-title" style="margin-bottom:12px">Insights</div>
    ${cards.map(c=>`
      <div class="insight-card ${c.color}">
        <div class="insight-icon">${c.icon}</div>
        <div class="insight-body">
          <div class="insight-title">${c.title}</div>
          <div class="insight-text">${c.text}</div>
        </div>
      </div>
    `).join('')}`;
}

// ─── SUMMARY ─────────────────────────────────────────────────────────────────
let currentPeriod = 'month';

function setPeriod(p) {
  currentPeriod = p;
  ['month','year','all'].forEach(x => {
    document.getElementById('pBtn-'+x).classList.toggle('active', x===p);
  });
  renderSummary();
}

function filterByPeriod(arr) {
  const now = new Date();
  return arr.filter(r => {
    const d = new Date(r.date);
    if (currentPeriod==='month') return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth();
    if (currentPeriod==='year')  return d.getFullYear()===now.getFullYear();
    return true;
  });
}

  const avg       = mpgs.length ? mpgs.reduce((a,b)=>a+b,0)/mpgs.length : null;

  // MPG trend vs previous period
  let trendHtml = '';
  if (currentPeriod !== 'all' && avg) {
    const prevFuel = prevPeriodFuel();
    const prevMpgs = prevFuel.filter(f=>f.mpg).map(f=>f.mpg);
    const prevAvg  = prevMpgs.length ? prevMpgs.reduce((a,b)=>a+b,0)/prevMpgs.length : null;
    if (prevAvg) {
      const diff = avg - prevAvg;
      trendHtml = `<span class="trend-arrow" style="color:${diff>=0?'var(--green)':'var(--red)'}">${diff>=0?'▲':'▼'}${Math.abs(diff).toFixed(1)}</span>`;
    }
  }

  document.getElementById('summaryGrid').innerHTML = `
    <div class="stat-card">
      <div class="stat-label">Total Spend</div>
      <div class="stat-value accent">£${total.toFixed(2)}</div>
      <div class="stat-sub">${periodLabel()}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Fuel Cost</div>
      <div class="stat-value">£${fuelCost.toFixed(2)}</div>
      <div class="stat-sub">${fuel.length} fill-up${fuel.length!==1?'s':''} · ${litres.toFixed(1)}L</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Service Cost</div>
      <div class="stat-value">£${maintCost.toFixed(2)}</div>
      <div class="stat-sub">${maint.length} record${maint.length!==1?'s':''}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Avg MPG</div>
      <div class="stat-value green">${avg?avg.toFixed(1):'—'}${trendHtml}</div>
      <div class="stat-sub">${mpgs.length} fill-up${mpgs.length!==1?'s':''} with data</div>
    </div>
  `;

  document.getElementById('breakdownTable').innerHTML = `
    <div class="breakdown-row"><span class="lbl">Fuel</span><span class="val">£${fuelCost.toFixed(2)}</span></div>
    <div class="breakdown-row"><span class="lbl">Maintenance</span><span class="val">£${maintCost.toFixed(2)}</span></div>
    <div class="breakdown-row total"><span class="lbl">Total</span><span class="val">£${total.toFixed(2)}</span></div>
  `;

  // MPG chart — last 10 fill-ups with data, colour-coded vs avg
  const globalAvg    = avgMpg(null);
  const mpgEntries   = state.fuel.filter(f=>f.mpg)
    .slice().sort((a,b)=>new Date(a.date)-new Date(b.date)).slice(-10);
  const maxMpgChart  = mpgEntries.length ? Math.max(...mpgEntries.map(f=>f.mpg)) : 50;

  document.getElementById('mpgChart').innerHTML = mpgEntries.length
    ? mpgEntries.map(f => {
        let cls = 'good';
        if (globalAvg) {
          if      (f.mpg < globalAvg * 0.93) cls = 'poor';
          else if (f.mpg < globalAvg * 0.97) cls = 'avg';
        }
        return `
        <div class="mpg-bar-row">
          <div class="mpg-bar-label">${shortDate(f.date)}</div>
          <div class="mpg-bar-track">
            <div class="mpg-bar-fill ${cls}" style="width:${(f.mpg/maxMpgChart*100).toFixed(1)}%"></div>
          </div>
          <div class="mpg-bar-val ${cls}">${f.mpg.toFixed(1)}</div>
        </div>`;
      }).join('')
    : '<div class="empty-msg">Add fill-ups with mileage to see MPG history.</div>';
}

function prevPeriodFuel() {
  const now = new Date();
  return state.fuel.filter(r => {
    const d = new Date(r.date);
    if (currentPeriod==='month') {
      const pm = new Date(now.getFullYear(), now.getMonth()-1, 1);
      return d.getFullYear()===pm.getFullYear() && d.getMonth()===pm.getMonth();
    }
    if (currentPeriod==='year') return d.getFullYear()===now.getFullYear()-1;
    return false;
  });
}

function periodLabel() {
  if (currentPeriod==='month') return new Date().toLocaleString('default',{month:'long',year:'numeric'});
  if (currentPeriod==='year')  return new Date().getFullYear();
  return 'All time';
}

// ─── HELPERS ─────────────────────────────────────────────────────────────────
function avgDailyMiles() {
  const pts = state.fuel.filter(f=>f.mileage&&f.date).slice().sort((a,b)=>new Date(a.date)-new Date(b.date));
  if (pts.length < 2) return 0;
  const first = pts[0], last = pts[pts.length-1];
  const days  = (new Date(last.date)-new Date(first.date))/86400000;
  if (days <= 0) return 0;
  return (last.mileage - first.mileage) / days;
}

function today() { return new Date().toISOString().slice(0,10); }

function fmtDate(str) {
  if (!str) return '—';
  return new Date(str+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
}
function shortDate(str) {
  if (!str) return '';
  return new Date(str+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'});
}

function closeModals() {
  document.querySelectorAll('.modal-backdrop').forEach(m=>m.classList.remove('open'));
}
document.querySelectorAll('.modal-backdrop').forEach(b=>{
  b.addEventListener('click', e=>{ if (e.target===b) closeModals(); });
});

// ─── INIT ─────────────────────────────────────────────────────────────────────
load();
renderMileagePill();
renderFuelList();
renderMaintList();
renderServiceBanner();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/Car-Log/sw.js').catch(()=>{});
}
</script>
